apiVersion: apps/v1
kind: Deployment
metadata:
  name: cve-harness
  namespace: agent-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cve-harness
  template:
    metadata:
      labels:
        app: cve-harness
    spec:
      serviceAccountName: harness-runner
      containers:
        - name: harness
          image: agent-harness-poc:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LITELLM_MODEL
              value: "anthropic/claude-haiku-4-5-20251001"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: ANTHROPIC_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: cve-harness
  namespace: agent-harness
spec:
  selector:
    app: cve-harness
  ports:
    - port: 8000
      targetPort: 8000
