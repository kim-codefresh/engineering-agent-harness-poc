apiVersion: batch/v1
kind: Job
metadata:
  name: cve-harness-run
  namespace: agent-harness
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: harness-runner
      restartPolicy: Never
      containers:
        - name: harness
          image: agent-harness-poc:local
          imagePullPolicy: IfNotPresent
          args: ["/data/sample_cve.json"]
          env:
            - name: OLLAMA_HOST
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_MODEL
              value: "llama3.2"
          volumeMounts:
            - name: cve-input
              mountPath: /data
      volumes:
        - name: cve-input
          configMap:
            name: sample-cve
