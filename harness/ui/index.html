<title>Agent Harness</title>
<style>
:root {
  --ground:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0; --border-2:#CBD5E1;
  --text:#0F172A; --text-mid:#475569; --text-dim:#94A3B8;
  --accent:#6366F1; --accent-bg:#EEF2FF; --accent-dark:#4338CA;
  --gate:#F59E0B; --gate-bg:#FFFBEB;
  --ok:#10B981; --ok-bg:#ECFDF5; --danger:#EF4444;
  --mono:'Menlo','Consolas','Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:8px; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --sh-lg:0 4px 16px rgba(0,0,0,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--ground);color:var(--text);font-size:14px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* shell */
#shell{display:flex;flex:1;overflow:hidden}
#nav{width:64px;background:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;flex-shrink:0}
#nav button{width:40px;height:40px;border:none;background:transparent;border-radius:8px;color:rgba(255,255,255,.5);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
#nav button.active,#nav button:hover{background:rgba(255,255,255,.12);color:#fff}
#nav .spacer{flex:1}
#sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#sidebar-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
#sidebar-add{width:28px;height:28px;border:none;background:var(--accent);border-radius:6px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sidebar-add:hover{opacity:.9}
#sidebar-list{flex:1;overflow-y:auto;padding:8px}
.list-item{padding:10px 12px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.list-item:hover{background:var(--ground)}
.list-item.active{background:var(--accent-bg)}
.list-item-name{font-size:13px;font-weight:500;font-family:var(--mono);color:var(--text)}
.list-item.active .list-item-name{color:var(--accent)}
.list-item-meta{font-size:11px;color:var(--text-dim)}
.list-empty{padding:32px 16px;text-align:center;color:var(--text-dim);font-size:13px}
.list-empty strong{display:block;margin-bottom:4px;color:var(--text-mid)}
#main{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}

/* topbar */
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:48px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.topbar-logo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.topbar-sep{width:1px;height:20px;background:var(--border)}
.topbar-status{font-size:12px;color:var(--text-dim)}
.topbar-status strong{color:var(--ok)}
.topbar-right{margin-left:auto;display:flex;gap:8px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 16px}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text-mid)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{padding:16px}

/* detail */
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.detail-name{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text)}
.detail-meta{font-size:12px;color:var(--text-dim);margin-top:2px}

/* interactive graph */
.graph-wrap{position:relative;overflow-x:auto;padding:8px 0}
svg.igraph{display:block;margin:0 auto}
.graph-toolbar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.node-editor{background:var(--ground);border-top:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:12px}
.node-editor-title{font-size:11px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.ne-grid{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center;font-size:13px}
.ne-label{color:var(--text-dim)}
.ne-input{padding:6px 8px;border:1px solid var(--border-2);border-radius:5px;font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface);width:100%}
.ne-input:focus{outline:none;border-color:var(--accent)}
.routes-table{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:center;font-size:12px;margin-top:4px}
.route-arrow{color:var(--text-dim);text-align:center}

/* yaml */
.yaml-pre{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--ground);border:1px solid var(--border);border-radius:6px;padding:14px 16px;white-space:pre;overflow-x:auto;color:var(--text);max-height:380px;overflow-y:auto}
.yaml-edit{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:14px 16px;color:var(--text);width:100%;min-height:280px;resize:vertical;outline:none}
.yaml-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.yaml-path{font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* runs */
.run-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.run-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.badge-waiting{background:var(--gate-bg);color:var(--gate);border:1px solid rgba(245,158,11,.25)}
.badge-complete{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(16,185,129,.25)}
.gate-box{background:var(--gate-bg);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.gate-label{font-size:11px;font-weight:600;color:var(--gate);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.gate-field{font-size:12px;color:var(--text-mid);margin-bottom:4px}
.gate-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gate-btn{padding:7px 16px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--mono);transition:all .15s}
.gate-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.gate-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--text-mid)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border-2);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface);outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:5px;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);color:var(--text-mid);transition:all .15s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.steps-builder{display:flex;flex-direction:column;gap:8px}
.step-row{display:flex;align-items:center;gap:8px;background:var(--ground);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.step-row select,.step-row input{flex:1;padding:6px 8px;border:1px solid var(--border-2);border-radius:4px;font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--text)}
.step-remove{width:24px;height:24px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;border-radius:4px}
.step-remove:hover{background:var(--danger);color:#fff}
.add-step-btn{padding:7px 12px;border:1px dashed var(--border-2);border-radius:6px;background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;text-align:left}
.add-step-btn:hover{border-color:var(--accent);color:var(--accent)}
.prop-grid{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13px}
.prop-label{color:var(--text-dim)}
.prop-value{color:var(--text);font-family:var(--mono);font-size:12px}

/* modal */
#pr-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200}
#pr-modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:12px;box-shadow:var(--sh-lg);width:480px;max-width:90vw;overflow:hidden}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-dim);cursor:pointer;line-height:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.pr-result{background:var(--ok-bg);border:1px solid rgba(16,185,129,.3);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--ok)}
.pr-result a{color:var(--accent);text-decoration:underline}
.pr-error{background:#FEF2F2;border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--danger)}

/* toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="topbar">
  <span class="topbar-logo">agent-harness</span>
  <div class="topbar-sep"></div>
  <span class="topbar-status" id="status-bar">connecting...</span>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="triggerRun()" style="font-size:12px;padding:6px 12px;">▶ New run</button>
  </div>
</div>

<div id="shell">
  <nav id="nav">
    <button onclick="setView('runs')" id="nav-runs" title="Runs">⚡</button>
    <button onclick="setView('workflows')" id="nav-workflows" title="Workflows">⬡</button>
    <button onclick="setView('agents')" id="nav-agents" title="Agents">◈</button>
    <button onclick="setView('steptypes')" id="nav-steptypes" title="Step types">⬘</button>
    <div class="spacer"></div>
    <button onclick="reloadRegistry()" title="Reload">↺</button>
  </nav>
  <aside id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">runs</span>
      <button id="sidebar-add" onclick="showCreate()" title="Create">+</button>
    </div>
    <div id="sidebar-list"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="pr-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Propose change as PR</span>
      <button class="modal-close" onclick="closePrModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>PR description</label>
        <input id="pr-desc" placeholder="e.g. Add scope check to CVE gate"/></div>
      <div class="field"><label>Target branch (base for the PR)</label>
        <select id="pr-branch" class="ne-input"><option value="">Loading branches…</option></select>
      </div>
      <div style="font-size:12px;color:var(--text-dim);">Creates a new branch on GitHub, commits the YAML,
        and opens a PR against the selected base branch. ArgoCD syncs on merge.</div>
      <div id="pr-result" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePrModal()">Cancel</button>
      <button class="btn btn-primary" id="pr-btn" onclick="submitPr()">Create PR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Global state ─────────────────────────────────────────────────────────────
const S = { view:'runs', selected:null, workflows:{}, agents:{}, stepTypes:[], runs:{} };
let _tab = 'graph';           // 'graph' | 'config'
let _editing = null;          // { type, id, config } local mutable copy
let _selectedStep = null;     // step id currently selected in graph editor

// ── YAML serialiser ──────────────────────────────────────────────────────────
function toYaml(obj, indent=0) {
  const sp = '  '.repeat(indent);
  if (obj === null || obj === undefined) return 'null';
  if (typeof obj === 'boolean') return String(obj);
  if (typeof obj === 'number')  return String(obj);
  if (typeof obj === 'string') {
    if (obj.includes('\n')) {
      // block scalar — much more readable for prompts
      const lines = obj.split('\n').map(l => `${sp}  ${l}`).join('\n');
      return `|\n${lines}`;
    }
    if (/[:{}\[\],#&*?|<>=!%@`]/.test(obj) || obj === 'true' || obj === 'false' || obj === 'null')
      return `"${obj.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"`;
    return obj;
  }
  if (Array.isArray(obj)) {
    if (!obj.length) return '[]';
    if (obj.every(x => typeof x !== 'object')) return `[${obj.join(', ')}]`;
    return obj.map(item => {
      if (typeof item !== 'object') return `${sp}- ${toYaml(item,0)}`;
      const lines = toYaml(item, indent+1).trimStart();
      return `${sp}- ${lines}`;
    }).join('\n');
  }
  const entries = Object.entries(obj).filter(([,v]) => v !== undefined && v !== null && v !== '');
  return entries.map(([k,v]) => {
    if (typeof v === 'object') {
      const child = toYaml(v, indent+1);
      if (child === '[]' || child === 'null') return `${sp}${k}: []`;
      return `${sp}${k}:\n${child}`;
    }
    const val = toYaml(v, indent);
    // block scalar values get their own line
    if (val.startsWith('|')) return `${sp}${k}: ${val}`;
    return `${sp}${k}: ${val}`;
  }).join('\n');
}

// ── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail||r.statusText); }
  return r.json();
}
function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = ok ? '#0F172A' : '#EF4444';
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2800);
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [wf,ag,st] = await Promise.all([api('GET','/api/workflows'),api('GET','/api/agents'),api('GET','/api/step-types')]);
    S.workflows=wf; S.agents=ag; S.stepTypes=st;
    document.getElementById('status-bar').innerHTML =
      `<strong>●</strong> ${Object.keys(wf).length} workflows · ${Object.keys(ag).length} agents`;
    render();
  } catch(e) { document.getElementById('status-bar').textContent = '● disconnected'; }
}

// ── Navigation ───────────────────────────────────────────────────────────────
function setView(v) {
  S.view=v; S.selected=null; _editing=null; _tab='graph';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  const b=document.getElementById('nav-'+v); if(b) b.classList.add('active');
  render();
}
function select(id) { S.selected=id; _editing=null; _tab='graph'; _selectedStep=null; render(); }
function switchTab(t) { _tab=t; renderMain(); }

// ── Render ───────────────────────────────────────────────────────────────────
function render() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const title=document.getElementById('sidebar-title');
  const list=document.getElementById('sidebar-list');
  const add=document.getElementById('sidebar-add');
  title.textContent=S.view;
  add.style.display=(S.view==='steptypes'||S.view==='runs')?'none':'flex';
  let items=[];
  if (S.view==='workflows') items=Object.values(S.workflows).map(w=>({id:w.id,meta:`${w.steps?.length||0} steps`}));
  else if (S.view==='agents') items=Object.values(S.agents).map(a=>({id:a.id,meta:`${a.steps?.length||0} step types`}));
  else if (S.view==='steptypes') items=S.stepTypes.map(t=>({id:t,meta:'built-in'}));
  else if (S.view==='runs') items=Object.entries(S.runs).map(([tid,r])=>({id:tid,meta:`${r.workflow} · ${r.status}`}));
  if (!items.length) {
    list.innerHTML=S.view==='runs'
      ?`<div class="list-empty"><strong>No active runs</strong>Click ▶ New run to start</div>`
      :`<div class="list-empty"><strong>Nothing here</strong>Click + to create</div>`;
    return;
  }
  list.innerHTML=items.map(i=>`<div class="list-item ${S.selected===i.id?'active':''}" onclick="select('${i.id}')">
    <div class="list-item-name">${i.id}</div><div class="list-item-meta">${i.meta}</div></div>`).join('');
}

function renderMain() {
  const main=document.getElementById('main');
  if (!S.selected) { main.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-dim);font-size:13px;">Select an item</div>`; return; }
  if (S.view==='workflows') renderWorkflowDetail(main);
  else if (S.view==='agents') renderAgentDetail(main);
  else if (S.view==='steptypes') renderStepTypeDetail(main);
  else if (S.view==='runs') renderRunDetail(main);
}

// ── Editing state helpers ────────────────────────────────────────────────────
function initEditing(type, id) {
  const src = type==='workflow' ? S.workflows[id] : S.agents[id];
  _editing = { type, id, config: JSON.parse(JSON.stringify(src)), serverYaml: null, dirty: false };
  _selectedStep = null;
  // fetch the authoritative YAML from server in the background
  const ep = type==='workflow' ? `/api/workflows/${id}/yaml` : `/api/agents/${id}/yaml`;
  api('GET', ep).then(r => { if (_editing && _editing.id===id) _editing.serverYaml = r.content; renderMain(); }).catch(()=>{});
}
function ensureEditing(type, id) { if (!_editing || _editing.id!==id) initEditing(type, id); }
function editingYaml() {
  // prefer server YAML (authoritative) until user makes local changes
  if (!_editing.dirty && _editing.serverYaml) return _editing.serverYaml;
  return toYaml(_editing.config);
}

// ── Tab bar ──────────────────────────────────────────────────────────────────
function tabBar(type, id, extra='') {
  return `<div class="tabs">
    <div class="tab ${_tab==='graph'?'active':''}" onclick="switchTab('graph')">⬡ Graph</div>
    <div class="tab ${_tab==='config'?'active':''}" onclick="switchTab('config')">⟨/⟩ Config</div>
    <div style="flex:1"></div>
    ${extra}
  </div>`;
}

// ── Workflow detail ───────────────────────────────────────────────────────────
function renderWorkflowDetail(main) {
  const wf = S.workflows[S.selected];
  if (!wf) return;
  ensureEditing('workflow', S.selected);
  main.innerHTML = `
    <div class="detail-header">
      <div><div class="detail-name">${wf.id}</div>
        <div class="detail-meta">trigger: ${wf.trigger?.source||'—'} / ${wf.trigger?.event||'—'}</div></div>
      <button class="btn btn-primary" onclick="startRun('${wf.id}')">▶ Run</button>
    </div>
    <div class="card">
      ${tabBar('workflow', wf.id)}
      <div id="tab-content">${_tab==='graph' ? renderGraphTab() : renderConfigTab()}</div>
    </div>`;
}

// ── Agent detail ──────────────────────────────────────────────────────────────
function renderAgentDetail(main) {
  const ag = S.agents[S.selected];
  if (!ag) return;
  ensureEditing('agent', S.selected);
  main.innerHTML = `
    <div class="detail-header">
      <div><div class="detail-name">${ag.id}</div>
        <div class="detail-meta">${ag.steps?.length||0} step types</div></div>
    </div>
    <div class="card">
      ${tabBar('agent', ag.id)}
      <div id="tab-content">${_tab==='graph' ? renderAgentGraphTab() : renderConfigTab()}</div>
    </div>`;
}

// ── Graph tab — workflow ──────────────────────────────────────────────────────
function renderGraphTab() {
  const steps = _editing.config.steps || [];
  const agentOpts = Object.keys(S.agents).map(a=>`<option value="${a}" ${''/*set later*/}>${a}</option>`).join('');
  const stepOpts  = (id) => steps.map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${s.id}</option>`).join('');

  const svg = buildWorkflowSvg(steps);
  const editor = _selectedStep ? buildStepEditor(_selectedStep, steps, agentOpts, stepOpts) : `<div style="font-size:12px;color:var(--text-dim);padding:12px 16px;">Click a node to edit it.</div>`;

  return `
    <div class="graph-toolbar">
      <button class="btn-sm" onclick="addWorkflowStep('agent')">+ Agent step</button>
      <button class="btn-sm" onclick="addWorkflowStep('gate')">⬟ Gate step</button>
      <div style="flex:1"></div>
      <button class="btn-sm accent" onclick="saveEditing()">Save changes</button>
    </div>
    <div class="graph-wrap">${svg}</div>
    <div class="node-editor" id="node-editor">${editor}</div>`;

function buildWorkflowSvg(steps) {
  if (!steps.length) return `<div style="padding:32px;text-align:center;color:var(--text-dim);font-size:13px;">No steps yet. Add one above.</div>`;
  const W=560, nodeW=160, nodeH=38, gateH=38, gap=50;
  const totalH = steps.length*(nodeH+gap)+32;
  const cx=W/2;
  let html=`<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#CBD5E1"/></marker></defs>`;
  steps.forEach((step,i) => {
    const y=16+i*(nodeH+gap), x=cx-nodeW/2;
    const isGate='gate' in step;
    const selected=_selectedStep===step.id;
    if (i>0) {
      const prevY=16+(i-1)*(nodeH+gap)+nodeH;
      html+=`<line x1="${cx}" y1="${prevY}" x2="${cx}" y2="${y}" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>`;
    }
    const selStroke = selected ? '#6366F1' : (isGate?'#F59E0B':'#6366F1');
    const selFill   = selected ? (isGate?'#FEF3C7':'#E0E7FF') : (isGate?'#FFFBEB':'#EEF2FF');
    const textCol   = isGate ? '#92400E' : '#4338CA';
    if (isGate) {
      const hw=nodeW/2, hh=gateH/2, mx=cx, my=y+hh;
      html+=`<polygon points="${mx},${my-hh} ${mx+hw},${my} ${mx},${my+hh} ${mx-hw},${my}"
        fill="${selFill}" stroke="${selStroke}" stroke-width="${selected?2:1.5}" style="cursor:pointer"
        onclick="selectStep('${step.id}')"/>
        <text x="${cx}" y="${my+4}" text-anchor="middle" font-size="11" fill="${textCol}"
          font-family="Menlo,monospace" font-weight="600" style="pointer-events:none">⬟ ${step.id}</text>`;
      // route labels
      if (step.routes) {
        let ri=0;
        for (const [opt] of Object.entries(step.routes)) {
          const lx=ri%2===0?cx-nodeW/2-6:cx+nodeW/2+6;
          const anchor=ri%2===0?'end':'start';
          html+=`<text x="${lx}" y="${my+4}" text-anchor="${anchor}" font-size="10" fill="#94A3B8" font-family="Menlo,monospace">${opt}</text>`;
          ri++;
        }
      }
    } else {
      html+=`<rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="6"
        fill="${selFill}" stroke="${selStroke}" stroke-width="${selected?2:1.5}" style="cursor:pointer"
        onclick="selectStep('${step.id}')"/>
        <text x="${cx}" y="${y+nodeH/2+4}" text-anchor="middle" font-size="11" fill="${textCol}"
          font-family="Menlo,monospace" font-weight="600" style="pointer-events:none">◈ ${step.id}</text>`;
    }
  });
  return `<svg class="igraph" width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}">${html}</svg>`;
}

function buildStepEditor(stepId, steps, agentOpts, stepOpts) {
  const step = steps.find(s=>s.id===stepId);
  if (!step) return '';
  const isGate = 'gate' in step;
  const stepIds = steps.map(s=>s.id).filter(id=>id!==stepId);

  if (isGate) {
    const g = step.gate||{};
    const opts = (g.options||[]).join(', ');
    const routeRows = (g.options||[]).map(opt=>`
      <div style="font-family:var(--mono);font-size:12px;color:var(--text-mid)">${opt}</div>
      <div class="route-arrow">→</div>
      <select class="ne-input" onchange="updateRoute('${stepId}','${opt}',this.value)">
        <option value="">— none —</option>
        ${stepIds.map(id=>`<option value="${id}" ${step.routes?.[opt]===id?'selected':''}>${id}</option>`).join('')}
      </select>`).join('');
    return `<div class="node-editor-title"><span>⬟ Gate: ${stepId}</span>
      <button class="btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="removeStep('${stepId}')">Delete</button></div>
      <div class="ne-grid">
        <span class="ne-label">Step ID</span><input class="ne-input" value="${step.id}" onchange="renameStep('${stepId}',this.value)"/>
        <span class="ne-label">Output field</span><input class="ne-input" value="${g.output_field||''}" onchange="updateGateField('${stepId}','output_field',this.value)"/>
        <span class="ne-label">Options</span><input class="ne-input" value="${opts}" placeholder="a, b, c" onchange="updateGateOptions('${stepId}',this.value)"/>
        <span class="ne-label" style="align-self:start;margin-top:2px">Routes</span>
        <div><div class="routes-table">${routeRows}</div></div>
      </div>`;
  } else {
    const currentAgent = step.agent||'';
    const aopts = Object.keys(S.agents).map(a=>`<option value="${a}" ${a===currentAgent?'selected':''}>${a}</option>`).join('');
    const nextOpts = steps.map(s=>s.id).filter(id=>id!==stepId)
      .map(id=>`<option value="${id}" ${step.next===id?'selected':''}>${id}</option>`).join('');
    return `<div class="node-editor-title"><span>◈ Agent step: ${stepId}</span>
      <button class="btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="removeStep('${stepId}')">Delete</button></div>
      <div class="ne-grid">
        <span class="ne-label">Step ID</span><input class="ne-input" value="${step.id}" onchange="renameStep('${stepId}',this.value)"/>
        <span class="ne-label">Agent</span><select class="ne-input" onchange="updateAgentStep('${stepId}',this.value)">${aopts}</select>
        <span class="ne-label">Next step</span>
        <select class="ne-input" onchange="updateNext('${stepId}',this.value)">
          <option value="">— end —</option>${nextOpts}
        </select>
      </div>`;
  }
}

// ── Graph tab — agent ─────────────────────────────────────────────────────────
function renderAgentGraphTab() {
  const steps = _editing.config.steps || [];
  const W=460, nodeW=200, nodeH=36, gap=44, cx=230;
  const totalH = steps.length*(nodeH+gap)+32;

    <polygon points="0 0,8 3,0 6" fill="#CBD5E1"/></marker></defs>`;
  steps.forEach((step,i)=>{

    svgHtml+=`<rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="6"

    : `<div style="padding:24px;text-align:center;color:var(--text-dim);font-size:13px;">No steps yet.</div>`;

function buildAgentStepEditor(stepId) {

// ── Graph edit actions ────────────────────────────────────────────────────────
function selectStep(id) { _selectedStep=id; renderMain(); }

function markDirty() { if (_editing) _editing.dirty = true; }

function addWorkflowStep(kind) {
  const steps=_editing.config.steps||(_editing.config.steps=[]);
  const idx=steps.length;
  if (kind==='agent') {
    const firstAgent=Object.keys(S.agents)[0]||'my_agent';
    steps.push({id:`step_${idx}`, agent:firstAgent});
  } else {
    steps.push({id:`gate_${idx}`, gate:{output_field:`decision_${idx}`, options:['approved','rejected']}, routes:{}});
  }
  _selectedStep=steps[steps.length-1].id;
  markDirty(); renderMain();
}

function addAgentStep() {
  const steps=_editing.config.steps||(_editing.config.steps=[]);
  const firstType=S.stepTypes[0]||'call_llm';
  const s={type:firstType, output_field:`result_${steps.length}`};
  steps.push(s);
  _selectedStep=s.type+steps.length;
  renderMain();
}

function removeStep(stepId) {
  _editing.config.steps=(_editing.config.steps||[]).filter(s=>s.id!==stepId);
  _selectedStep=null;
  markDirty(); renderMain();
}

function removeAgentStep(idx) {
  (_editing.config.steps||[]).splice(idx,1);
  _selectedStep=null;
  renderMain();
}

function renameStep(oldId, newId) {
  const step=(_editing.config.steps||[]).find(s=>s.id===oldId);
  if (!step) return;
  // update routes pointing to oldId
  (_editing.config.steps||[]).forEach(s=>{
    if (s.routes) for (const k of Object.keys(s.routes)) if(s.routes[k]===oldId) s.routes[k]=newId;
    if (s.next===oldId) s.next=newId;
  });
  step.id=newId; _selectedStep=newId; markDirty(); renderMain();
}

function updateAgentStep(stepId, agentId) {
  const step=(_editing.config.steps||[]).find(s=>s.id===stepId);
  if (step) { step.agent=agentId; markDirty(); renderMain(); }
}
function updateNext(stepId, nextId) {
  const step=(_editing.config.steps||[]).find(s=>s.id===stepId);
  if (step) { step.next=nextId||undefined; markDirty(); renderMain(); }
}
function updateGateField(stepId, field, value) {
  const step=(_editing.config.steps||[]).find(s=>s.id===stepId);
  if (step?.gate) { step.gate[field]=value; markDirty(); renderMain(); }
}
function updateGateOptions(stepId, value) {
  const step=(_editing.config.steps||[]).find(s=>s.id===stepId);
  if (!step?.gate) return;
  step.gate.options=value.split(',').map(s=>s.trim()).filter(Boolean);
  markDirty(); renderMain();
}
function updateRoute(stepId, option, dest) {
  const step=(_editing.config.steps||[]).find(s=>s.id===stepId);
  if (!step) return;
  if (!step.routes) step.routes={};
  if (dest) step.routes[option]=dest; else delete step.routes[option];
  markDirty(); renderMain();
}
function updateAgentStepField(idx, field, value) {
  const steps=_editing.config.steps||[];
  if (steps[idx]) { steps[idx][field]=value; markDirty(); renderMain(); }
}

async function saveEditing() {
  if (!_editing) return;
  // if user edited raw YAML, parse it back (server accepts JSON config)
  // for now just save the config object directly
  try {
    const ep = _editing.type==='workflow' ? '/api/workflows' : '/api/agents';
    await api('POST', ep, _editing.config);
    await boot();
    toast(`${_editing.id} saved`);
    // refresh local editing copy from new server state
    initEditing(_editing.type, _editing.id);
    renderMain();
  } catch(e) { toast(e.message, false); }
}

async function submitPr() {
  const desc=document.getElementById('pr-desc').value.trim();
  const content=editingYaml();
  document.getElementById('pr-btn').textContent='Creating…';
  document.getElementById('pr-btn').disabled=true;
  try {
    const branch=document.getElementById('pr-branch').value;
    const r=await api('POST','/api/propose',{type:_editing.type, id:_editing.id, content, description:desc, base_branch:branch});
    const el=document.getElementById('pr-result');
    el.style.display='block'; el.className='pr-result';
    el.innerHTML=`✅ PR created — <a href="${r.pr_url}" target="_blank">${r.pr_url}</a><br/>
      <span style="font-size:11px;color:var(--text-dim)">Branch: ${r.branch}</span>`;
    document.getElementById('pr-btn').style.display='none';
    toast('PR created');
  } catch(e) {
    const el=document.getElementById('pr-result');
    el.style.display='block'; el.className='pr-error'; el.textContent=`Error: ${e.message}`;
    document.getElementById('pr-btn').textContent='Create PR';
    document.getElementById('pr-btn').disabled=false;
  }
}

async function submitDecision(wfId, threadId, decision) {
  try {
    const r=await api('POST',`/api/decision/${wfId}/${threadId}`,{decision});
    S.runs[threadId]={...r, workflow:wfId, thread_id:threadId};
    render(); toast(r.status==='complete'?`✅ ${r.outcome?.status}`:`Gate passed → ${r.gate?.gate}`);
  } catch(e) { toast(e.message,false); }
}

async function startRun(wfId) {
  const threadId=`${wfId}-${Date.now()}`;
  const ticket={cve_id:'CVE-2026-99999', advisory:{id:'CVE-2026-99999',summary:'RCE in demo-package',package:'demo-package',affected_versions:['1.2.0','1.2.1']}, dependencies:{'demo-package':'1.2.0'}};
  try {
    const r=await api('POST',`/api/run/${wfId}/${threadId}`,ticket);
    S.runs[threadId]={...r, workflow:wfId, thread_id:threadId};
    S.view='runs'; S.selected=threadId; render(); toast(`Run started`);
  } catch(e) { toast(e.message,false); }
}

async function triggerRun() {
  const ids=Object.keys(S.workflows);
  if (!ids.length) { toast('No workflows yet',false); return; }
  await startRun(ids[0]);
}

async function reloadRegistry() {

  catch(e) { toast(e.message,false); }
}

      </div>
      <div class="btn-row"><button class="btn btn-ghost" onclick="render()">Cancel</button>
        <button class="btn btn-primary" onclick="saveNewWorkflow()">Save workflow</button></div>
    </div></div></div>`;
}

function addWfAgent() {
  const c=document.getElementById('wf-steps'); const row=document.createElement('div');
  row.className='step-row'; row.dataset.kind='agent';
  const agOpts=Object.keys(S.agents).map(a=>`<option value="${a}">${a}</option>`).join('')||'<option>— no agents —</option>';
  row.innerHTML=`<span style="font-size:10px;color:var(--accent);font-family:var(--mono);width:44px;flex-shrink:0">◈ agent</span>
    <input placeholder="step id" style="max-width:120px"/><select>${agOpts}</select>
    <button class="step-remove" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(row);
}

function addWfGate() {
  const c=document.getElementById('wf-steps'); const row=document.createElement('div');
  row.className='step-row'; row.dataset.kind='gate';
  row.innerHTML=`<span style="font-size:10px;color:var(--gate);font-family:var(--mono);width:44px;flex-shrink:0">⬟ gate</span>
    <input placeholder="step id" style="max-width:120px"/>
    <input placeholder="output field" style="max-width:130px"/>
    <input placeholder="options: a,b,c"/>
    <button class="step-remove" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(row);
}

async function saveNewWorkflow() {
  const id=document.getElementById('wf-id').value.trim();
  const trigger=document.getElementById('wf-trigger').value.trim();
  if (!id) { toast('Workflow ID required',false); return; }
  const rows=document.querySelectorAll('#wf-steps .step-row');
  const steps=[];
  rows.forEach((row,i)=>{
    const inputs=row.querySelectorAll('input');
    const selects=row.querySelectorAll('select');
    if (row.dataset.kind==='agent') {
      steps.push({id:inputs[0].value.trim()||`step_${i}`, agent:selects[0]?.value});
    } else {
      steps.push({id:inputs[0].value.trim()||`gate_${i}`,
        gate:{output_field:inputs[1].value.trim()||'decision',
          options:(inputs[2].value||'approved,rejected').split(',').map(s=>s.trim())}});
    }
  });
  for (let i=0;i<steps.length-1;i++) if (!('gate' in steps[i])&&!steps[i].routes) steps[i].next=steps[i+1].id;
  const wf={id, trigger:{event:trigger}, steps, terminal_step:steps.at(-1)?.id};
  try {
    await api('POST','/api/workflows',wf);
    await boot(); S.view='workflows'; S.selected=id; render(); toast(`Workflow '${id}' saved`);
  } catch(e) { toast(e.message,false); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
setView('runs');
boot();
</script>
