<title>Agent Harness</title>
<style>
:root {
  --ground:   #F8FAFC;
  --surface:  #FFFFFF;
  --border:   #E2E8F0;
  --border-2: #CBD5E1;
  --text:     #0F172A;
  --text-mid: #475569;
  --text-dim: #94A3B8;
  --accent:   #6366F1;
  --accent-bg:#EEF2FF;
  --gate:     #F59E0B;
  --gate-bg:  #FFFBEB;
  --ok:       #10B981;
  --ok-bg:    #ECFDF5;
  --danger:   #EF4444;
  --mono:     'Menlo','Consolas','Courier New',monospace;
  --sans:     system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:   8px;
  --shadow:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.10);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--sans); background:var(--ground); color:var(--text); font-size:14px; line-height:1.5; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* ── Shell ─────────────────────────────────────── */
#shell { display:flex; flex:1; overflow:hidden; }
#nav { width:64px; background:var(--text); display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:8px; flex-shrink:0; }
#nav button { width:40px; height:40px; border:none; background:transparent; border-radius:8px; color:rgba(255,255,255,.5); cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; transition:background .15s,color .15s; }
#nav button.active, #nav button:hover { background:rgba(255,255,255,.12); color:#fff; }
#nav .spacer { flex:1; }

#sidebar { width:280px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
#sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
#sidebar-title { font-size:13px; font-weight:600; color:var(--text); letter-spacing:.02em; text-transform:uppercase; }
#sidebar-add { width:28px; height:28px; border:none; background:var(--accent); border-radius:6px; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#sidebar-add:hover { opacity:.9; }
#sidebar-list { flex:1; overflow-y:auto; padding:8px; }
.list-item { padding:10px 12px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
.list-item:hover { background:var(--ground); }
.list-item.active { background:var(--accent-bg); }
.list-item-name { font-size:13px; font-weight:500; font-family:var(--mono); color:var(--text); }
.list-item.active .list-item-name { color:var(--accent); }
.list-item-meta { font-size:11px; color:var(--text-dim); }
.list-empty { padding:32px 16px; text-align:center; color:var(--text-dim); font-size:13px; }
.list-empty strong { display:block; margin-bottom:4px; color:var(--text-mid); }

#main { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:20px; }

/* ── Cards ─────────────────────────────────────── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
.card-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.card-title { font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:8px; }
.card-body { padding:18px; }

/* ── Diagram ───────────────────────────────────── */
#diagram-wrap { overflow-x:auto; }
svg.diagram { display:block; }

/* ── Run cards ─────────────────────────────────── */
.run-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
.run-header { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.run-id { font-family:var(--mono); font-size:12px; color:var(--text-mid); }
.run-workflow { font-size:13px; font-weight:600; color:var(--text); }
.badge { font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.05em; }
.badge-waiting { background:var(--gate-bg); color:var(--gate); border:1px solid rgba(245,158,11,.25); }
.badge-complete { background:var(--ok-bg); color:var(--ok); border:1px solid rgba(16,185,129,.25); }
.run-body { padding:16px; }
.gate-box { background:var(--gate-bg); border:1px solid rgba(245,158,11,.3); border-radius:6px; padding:14px 16px; margin-bottom:14px; }
.gate-label { font-size:11px; font-weight:600; color:var(--gate); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
.gate-field { font-size:12px; color:var(--text-mid); margin-bottom:4px; }
.gate-field strong { color:var(--text); }
.gate-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.gate-btn { padding:7px 16px; border-radius:6px; border:1px solid var(--border-2); background:var(--surface); color:var(--text); font-size:12px; font-weight:500; cursor:pointer; font-family:var(--mono); transition:all .15s; }
.gate-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }
.gate-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.gate-btn.primary:hover { opacity:.9; }

/* ── Forms ─────────────────────────────────────── */
.form { display:flex; flex-direction:column; gap:14px; }
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:12px; font-weight:500; color:var(--text-mid); }
.field input, .field select, .field textarea {
  padding:8px 10px; border:1px solid var(--border-2); border-radius:6px;
  font-family:var(--mono); font-size:12px; color:var(--text); background:var(--surface);
  outline:none; transition:border .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,.1); }
.field textarea { min-height:80px; resize:vertical; line-height:1.5; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn { padding:9px 18px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { opacity:.9; }
.btn-ghost { background:transparent; color:var(--text-mid); border:1px solid var(--border-2); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }

/* ── Steps builder ─────────────────────────────── */
.steps-builder { display:flex; flex-direction:column; gap:8px; }
.step-row { display:flex; align-items:center; gap:8px; background:var(--ground); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
.step-row select, .step-row input { flex:1; padding:6px 8px; border:1px solid var(--border-2); border-radius:4px; font-family:var(--mono); font-size:12px; background:var(--surface); color:var(--text); }
.step-remove { width:24px; height:24px; border:none; background:transparent; color:var(--text-dim); cursor:pointer; font-size:16px; line-height:1; border-radius:4px; }
.step-remove:hover { background:var(--danger); color:#fff; }
.add-step-btn { padding:7px 12px; border:1px dashed var(--border-2); border-radius:6px; background:transparent; color:var(--text-dim); font-size:12px; cursor:pointer; text-align:left; }
.add-step-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ── Detail panels ─────────────────────────────── */
.detail-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
.detail-name { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text); }
.detail-meta { font-size:12px; color:var(--text-dim); margin-top:2px; }
.prop-grid { display:grid; grid-template-columns:140px 1fr; gap:8px 16px; font-size:13px; }
.prop-label { color:var(--text-dim); }
.prop-value { color:var(--text); font-family:var(--mono); font-size:12px; }
.tag { display:inline-flex; align-items:center; gap:4px; background:var(--ground); border:1px solid var(--border); border-radius:4px; padding:2px 7px; font-family:var(--mono); font-size:11px; color:var(--text-mid); }
.tag-list { display:flex; flex-wrap:wrap; gap:4px; }

/* ── Top bar ───────────────────────────────────── */
#topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 20px; height:48px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
.topbar-logo { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text); letter-spacing:-.02em; }
.topbar-sep { width:1px; height:20px; background:var(--border); }
.topbar-status { font-size:12px; color:var(--text-dim); }
.topbar-status strong { color:var(--ok); }
.topbar-right { margin-left:auto; display:flex; gap:8px; }

/* ── YAML panel ────────────────────────────────── */
.yaml-panel { font-family:var(--mono); font-size:12px; line-height:1.6; background:var(--ground); border:1px solid var(--border); border-radius:6px; padding:14px 16px; white-space:pre; overflow-x:auto; color:var(--text); max-height:320px; overflow-y:auto; }
.yaml-textarea { font-family:var(--mono); font-size:12px; line-height:1.6; background:var(--surface); border:1px solid var(--accent); border-radius:6px; padding:14px 16px; color:var(--text); width:100%; min-height:220px; resize:vertical; outline:none; }
.yaml-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.yaml-path { font-family:var(--mono); font-size:11px; color:var(--text-dim); flex:1; }
.btn-sm { padding:5px 12px; font-size:12px; border-radius:5px; cursor:pointer; border:1px solid var(--border-2); background:var(--surface); color:var(--text-mid); transition:all .15s; }
.btn-sm:hover { border-color:var(--accent); color:var(--accent); }
.btn-sm.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* ── PR modal ───────────────────────────────────── */
#pr-modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:200; }
#pr-modal.open { display:flex; }
.modal-box { background:var(--surface); border-radius:12px; box-shadow:var(--shadow-lg); width:480px; max-width:90vw; overflow:hidden; }
.modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-title { font-size:14px; font-weight:600; }
.modal-close { background:none; border:none; font-size:20px; color:var(--text-dim); cursor:pointer; line-height:1; }
.modal-body { padding:20px; display:flex; flex-direction:column; gap:14px; }
.modal-footer { padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
.pr-result { background:var(--ok-bg); border:1px solid rgba(16,185,129,.3); border-radius:6px; padding:12px 14px; font-size:13px; color:var(--ok); }
.pr-result a { color:var(--accent); text-decoration:underline; }

/* ── Toast ─────────────────────────────────────── */
#toast { position:fixed; bottom:24px; right:24px; background:var(--text); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:100; }
#toast.show { opacity:1; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div id="topbar">
  <span class="topbar-logo">agent-harness</span>
  <div class="topbar-sep"></div>
  <span class="topbar-status" id="status-bar">connecting...</span>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="triggerRun()" style="font-size:12px;padding:6px 12px;">▶ New run</button>
  </div>
</div>

<div id="shell">
  <nav id="nav">
    <button onclick="setView('runs')" id="nav-runs" title="Runs">⚡</button>
    <button onclick="setView('workflows')" id="nav-workflows" title="Workflows">⬡</button>
    <button onclick="setView('agents')" id="nav-agents" title="Agents">◈</button>
    <button onclick="setView('steptypes')" id="nav-steptypes" title="Step types">⬘</button>
    <div class="spacer"></div>
    <button onclick="reloadRegistry()" title="Reload">↺</button>
  </nav>

  <aside id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">runs</span>
      <button id="sidebar-add" onclick="showCreate()" title="Create">+</button>
    </div>
    <div id="sidebar-list"></div>
  </aside>

  <main id="main"></main>
</div>

<div id="toast"></div>

<div id="pr-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Propose change as PR</span>
      <button class="modal-close" onclick="closePrModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>PR description</label>
        <input id="pr-desc" placeholder="e.g. Add scope check to CVE assessment gate" />
      </div>
      <div style="font-size:12px;color:var(--text-dim);">
        This will create a branch on GitHub, commit the YAML, and open a PR against
        <code style="font-family:var(--mono);color:var(--text-mid)">feat/full-cve-flow-human-gates-lift-and-shift</code>.
        ArgoCD will sync it automatically once merged.
      </div>
      <div id="pr-result" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePrModal()">Cancel</button>
      <button class="btn btn-primary" id="pr-submit-btn" onclick="submitPr()">Create PR</button>
    </div>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────────────
const S = {
  view: 'runs',
  selected: null,
  workflows: {},
  agents: {},
  stepTypes: [],
  runs: {},       // thread_id → run state
};

// ── API ─────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({detail: r.statusText})); throw new Error(e.detail || r.statusText); }
  return r.json();
}

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? '#0F172A' : '#EF4444';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

// ── Boot ────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [wf, ag, st] = await Promise.all([
      api('GET', '/api/workflows'),
      api('GET', '/api/agents'),
      api('GET', '/api/step-types'),
    ]);
    S.workflows = wf; S.agents = ag; S.stepTypes = st;
    document.getElementById('status-bar').innerHTML =
      `<strong>●</strong> ${Object.keys(wf).length} workflows · ${Object.keys(ag).length} agents`;
    render();
  } catch(e) {
    document.getElementById('status-bar').textContent = '● disconnected — is the server running?';
  }
}

// ── Navigation ──────────────────────────────────────────────────────────────
function setView(v) {
  S.view = v; S.selected = null;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-' + v);
  if (btn) btn.classList.add('active');
  render();
}

function select(id) { S.selected = id; render(); }

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const title = document.getElementById('sidebar-title');
  const list  = document.getElementById('sidebar-list');
  const add   = document.getElementById('sidebar-add');

  title.textContent = S.view;
  add.style.display = (S.view === 'steptypes' || S.view === 'runs') ? 'none' : 'flex';

  let items = [];
  if (S.view === 'workflows') items = Object.values(S.workflows).map(w => ({ id: w.id, meta: `${w.steps?.length || 0} steps` }));
  else if (S.view === 'agents') items = Object.values(S.agents).map(a => ({ id: a.id, meta: `${a.steps?.length || 0} step types` }));
  else if (S.view === 'steptypes') items = S.stepTypes.map(t => ({ id: t, meta: 'built-in' }));
  else if (S.view === 'runs') items = Object.entries(S.runs).map(([tid, r]) => ({ id: tid, meta: `${r.workflow} · ${r.status}` }));

  if (!items.length) {
    list.innerHTML = S.view === 'runs'
      ? `<div class="list-empty"><strong>No active runs</strong>Click "New run" to start one</div>`
      : `<div class="list-empty"><strong>Nothing here yet</strong>Click + to create one</div>`;
    return;
  }

  list.innerHTML = items.map(i => `
    <div class="list-item ${S.selected === i.id ? 'active' : ''}" onclick="select('${i.id}')">
      <div class="list-item-name">${i.id}</div>
      <div class="list-item-meta">${i.meta}</div>
    </div>`).join('');
}

function renderMain() {
  const main = document.getElementById('main');
  if (!S.selected) { renderEmpty(main); return; }

  if (S.view === 'workflows') renderWorkflowDetail(main, S.workflows[S.selected]);
  else if (S.view === 'agents') renderAgentDetail(main, S.agents[S.selected]);
  else if (S.view === 'steptypes') renderStepTypeDetail(main, S.selected);
  else if (S.view === 'runs') renderRunDetail(main, S.runs[S.selected]);
}

function renderEmpty(main) {
  const labels = { workflows:'workflow', agents:'agent', steptypes:'step type', runs:'run' };
  main.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-dim);font-size:13px;">
    Select a ${labels[S.view] || 'item'} to view details</div>`;
}

// ── Workflow detail ──────────────────────────────────────────────────────────
function renderWorkflowDetail(main, wf) {
  if (!wf) return;
  const steps = wf.steps || [];
  main.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${wf.id}</div>
        <div class="detail-meta">trigger: ${wf.trigger?.source || '—'} / ${wf.trigger?.event || '—'}</div>
      </div>
      <button class="btn btn-primary" onclick="startRun('${wf.id}')">▶ Run this workflow</button>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">⬡ Flow diagram</span></div>
      <div class="card-body" id="diagram-wrap"><svg class="diagram" id="wf-diagram"></svg></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Steps</span></div>
      <div class="card-body">
        <div class="prop-grid">
          ${steps.map(s => `
            <div class="prop-label">${s.id}</div>
            <div class="prop-value">${'gate' in s
              ? `<span style="color:var(--gate)">⬟ gate</span> · ${s.gate?.output_field} [${(s.gate?.options||[]).join(', ')}]`
              : `<span style="color:var(--accent)">◈ agent</span> · ${s.agent || '—'}`}</div>
          `).join('')}
        </div>
      </div>
    </div>`;
  drawDiagram('wf-diagram', steps);
  // append YAML panel without overwriting innerHTML
  main.insertAdjacentHTML('beforeend', yamlCard('workflow', wf.id));
}

// ── SVG diagram ──────────────────────────────────────────────────────────────
function drawDiagram(svgId, steps) {
  const svg = document.getElementById(svgId);
  if (!svg || !steps.length) return;

  const W = 600, nodeW = 140, nodeH = 36, gateH = 36, padX = 24, gap = 52;
  const totalH = steps.length * (nodeH + gap) + 20;
  svg.setAttribute('width', W);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${W} ${totalH}`);

  let html = `<defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#CBD5E1"/>
    </marker>
  </defs>`;

  const cx = W / 2;
  steps.forEach((step, i) => {
    const y = 10 + i * (nodeH + gap);
    const x = cx - nodeW / 2;
    const isGate = 'gate' in step;

    // connector line from previous
    if (i > 0) {
      const prevY = 10 + (i-1) * (nodeH + gap) + nodeH;
      html += `<line x1="${cx}" y1="${prevY}" x2="${cx}" y2="${y}" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>`;
    }

    if (isGate) {
      // diamond shape for gate
      const hw = nodeW / 2, hh = gateH / 2;
      const mx = cx, my = y + hh;
      html += `<polygon points="${mx},${my-hh} ${mx+hw},${my} ${mx},${my+hh} ${mx-hw},${my}"
        fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="${cx}" y="${my+4}" text-anchor="middle" font-size="11" fill="#B45309" font-family="Menlo,Consolas,monospace" font-weight="600">⬟ ${step.id}</text>`;

      // branch labels
      if (step.routes) {
        let ri = 0;
        for (const [opt, dest] of Object.entries(step.routes)) {
          const lx = ri % 2 === 0 ? cx - nodeW/2 - 8 : cx + nodeW/2 + 8;
          const anchor = ri % 2 === 0 ? 'end' : 'start';
          html += `<text x="${lx}" y="${my + 4}" text-anchor="${anchor}" font-size="10" fill="#94A3B8" font-family="Menlo,Consolas,monospace">${opt}</text>`;
          ri++;
        }
      }
    } else {
      // rounded rect for agent
      html += `<rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="6"
        fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
        <text x="${cx}" y="${y + nodeH/2 + 4}" text-anchor="middle" font-size="11" fill="#4338CA" font-family="Menlo,Consolas,monospace" font-weight="600">◈ ${step.id}</text>`;
    }
  });

  svg.innerHTML = html;
}

// ── Agent detail ─────────────────────────────────────────────────────────────
function renderAgentDetail(main, ag) {
  if (!ag) return;
  main.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${ag.id}</div>
        <div class="detail-meta">${ag.steps?.length || 0} step types</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Steps</span></div>
      <div class="card-body">
        <div class="prop-grid">
          ${(ag.steps||[]).map(s => `
            <div class="prop-label">${s.type}</div>
            <div class="prop-value">→ ${s.output_field || s.output || '—'}</div>
          `).join('')}
        </div>
      </div>
    </div>`;
  main.insertAdjacentHTML('beforeend', yamlCard('agent', ag.id));
}

// ── Step type detail ──────────────────────────────────────────────────────────
function renderStepTypeDetail(main, id) {
  main.innerHTML = `
    <div class="detail-header"><div><div class="detail-name">${id}</div>
      <div class="detail-meta">built-in step type · harness team owned</div></div></div>
    <div class="card"><div class="card-body">
      <p style="font-size:13px;color:var(--text-mid);">
        Step types are implemented in Python by the harness team and versioned with the harness image.
        Agents and workflows reference them by name.
      </p>
    </div></div>`;
}

// ── Run detail ────────────────────────────────────────────────────────────────
function renderRunDetail(main, run) {
  if (!run) return;
  const isWaiting = run.status === 'waiting_for_human';
  const gate = run.gate || {};
  const state = gate.state || {};

  main.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${run.thread_id}</div>
        <div class="detail-meta">workflow: ${run.workflow}</div>
      </div>
      <span class="badge ${isWaiting ? 'badge-waiting' : 'badge-complete'}">${run.status}</span>
    </div>
    ${isWaiting ? `
      <div class="card">
        <div class="card-header"><span class="card-title">⬟ Gate decision required</span></div>
        <div class="card-body">
          <div class="gate-box">
            <div class="gate-label">⬟ ${gate.gate || '—'}</div>
            ${state.assessment ? `
              <div class="gate-field"><strong>Affected:</strong> ${state.assessment.affected ? '⚠️ Yes' : '✅ No'}</div>
              <div class="gate-field"><strong>Risk:</strong> ${state.assessment.risk_level || '—'}</div>
              <div class="gate-field"><strong>Reasoning:</strong> ${state.assessment.reasoning || '—'}</div>
              <div class="gate-field"><strong>Agent recommends:</strong> ${state.assessment.recommended_disposition || '—'}</div>
            ` : ''}
            ${state.pr ? `
              <div class="gate-field"><strong>PR:</strong> ${state.pr.url || '—'}</div>
              <div class="gate-field"><strong>Title:</strong> ${state.pr.title || '—'}</div>
            ` : ''}
            ${state.validation ? `
              <div class="gate-field"><strong>Tests:</strong> ✅ ${state.validation.tests_run} passed</div>
              <div class="gate-field"><strong>Rescan:</strong> ${state.validation.scan_clean ? '✅ Clean' : '❌ Still flagged'}</div>
            ` : ''}
            <div class="gate-actions">
              ${(gate.options || []).map((opt, i) => `
                <button class="gate-btn ${i === 0 ? 'primary' : ''}"
                  onclick="submitDecision('${run.workflow}','${run.thread_id}','${opt}')">
                  ${opt}
                </button>`).join('')}
            </div>
          </div>
        </div>
      </div>
    ` : `
      <div class="card"><div class="card-body">
        <div class="prop-grid">
          <div class="prop-label">Status</div><div class="prop-value">${run.outcome?.status || '—'}</div>
          <div class="prop-label">Summary</div><div class="prop-value">${run.outcome?.summary || '—'}</div>
        </div>
      </div></div>
    `}`;
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function submitDecision(wfId, threadId, decision) {
  try {
    const r = await api('POST', `/api/decision/${wfId}/${threadId}`, { decision });
    S.runs[threadId] = { ...r, workflow: wfId, thread_id: threadId };
    render();
    toast(r.status === 'complete' ? `✅ Complete: ${r.outcome?.status}` : `Gate passed → ${r.gate?.gate}`);
  } catch(e) { toast(e.message, false); }
}

async function startRun(wfId) {
  const threadId = `${wfId}-${Date.now()}`;
  const sampleTicket = {
    cve_id: 'CVE-2026-99999',
    advisory: { id:'CVE-2026-99999', summary:'RCE in demo-package', package:'demo-package', affected_versions:['1.2.0','1.2.1'] },
    dependencies: { 'demo-package':'1.2.0' },
  };
  try {
    const r = await api('POST', `/api/run/${wfId}/${threadId}`, sampleTicket);
    S.runs[threadId] = { ...r, workflow: wfId, thread_id: threadId };
    S.view = 'runs'; S.selected = threadId;
    render();
    toast(`Run started: ${threadId}`);
  } catch(e) { toast(e.message, false); }
}

async function triggerRun() {
  const wfIds = Object.keys(S.workflows);
  if (!wfIds.length) { toast('No workflows registered yet', false); return; }
  await startRun(wfIds[0]);
}

async function reloadRegistry() {
  try {
    await api('POST', '/api/reload');
    await boot();
    toast('Registry reloaded');
  } catch(e) { toast(e.message, false); }
}

// ── Create forms ──────────────────────────────────────────────────────────────
function showCreate() {
  if (S.view === 'agents') showCreateAgent();
  else if (S.view === 'workflows') showCreateWorkflow();
}

function showCreateAgent() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="detail-header"><div class="detail-name">New agent</div></div>
    <div class="card"><div class="card-body">
      <div class="form" id="agent-form">
        <div class="field"><label>Agent ID</label>
          <input id="ag-id" placeholder="e.g. my_assessor" /></div>
        <div class="field"><label>Steps</label>
          <div class="steps-builder" id="ag-steps"></div>
          <button class="add-step-btn" onclick="addStepRow('ag-steps')">+ Add step type</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="render()">Cancel</button>
          <button class="btn btn-primary" onclick="saveAgent()">Save agent</button>
        </div>
      </div>
    </div></div>`;
  addStepRow('ag-steps');
}

function addStepRow(containerId) {
  const c = document.getElementById(containerId);
  const row = document.createElement('div');
  row.className = 'step-row';
  const opts = S.stepTypes.map(t => `<option value="${t}">${t}</option>`).join('');
  row.innerHTML = `
    <select>${opts}</select>
    <input placeholder="output_field" />
    <button class="step-remove" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(row);
}

async function saveAgent() {
  const id = document.getElementById('ag-id').value.trim();
  if (!id) { toast('Agent ID required', false); return; }
  const rows = document.querySelectorAll('#ag-steps .step-row');
  const steps = Array.from(rows).map(r => ({
    type: r.querySelector('select').value,
    output_field: r.querySelector('input').value.trim() || r.querySelector('select').value + '_result',
  }));
  try {
    await api('POST', '/api/agents', { id, steps });
    await boot();
    S.view = 'agents'; S.selected = id;
    render(); toast(`Agent '${id}' saved`);
  } catch(e) { toast(e.message, false); }
}

function showCreateWorkflow() {
  const main = document.getElementById('main');
  const agentOpts = Object.keys(S.agents).map(a => `<option value="${a}">${a}</option>`).join('');
  main.innerHTML = `
    <div class="detail-header"><div class="detail-name">New workflow</div></div>
    <div class="card"><div class="card-body">
      <div class="form">
        <div class="field-row">
          <div class="field"><label>Workflow ID</label><input id="wf-id" placeholder="e.g. bug_fix"/></div>
          <div class="field"><label>Trigger event</label><input id="wf-trigger" placeholder="e.g. linear.issue.updated"/></div>
        </div>
        <div class="field"><label>Steps — add agents and gates in order</label>
          <div class="steps-builder" id="wf-steps"></div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="add-step-btn" onclick="addWfAgent()">+ Agent step</button>
            <button class="add-step-btn" onclick="addWfGate()">⬟ Gate step</button>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="render()">Cancel</button>
          <button class="btn btn-primary" onclick="saveWorkflow()">Save workflow</button>
        </div>
      </div>
    </div></div>`;

  const agOpts = Object.keys(S.agents).map(a => `<option value="${a}">${a}</option>`).join('') || '<option>— no agents yet —</option>';
  document.getElementById('wf-steps')._agentOpts = agOpts;
}

function addWfAgent() {
  const c = document.getElementById('wf-steps');
  const row = document.createElement('div');
  row.className = 'step-row';
  row.dataset.kind = 'agent';
  row.innerHTML = `
    <span style="font-size:10px;color:var(--accent);font-family:var(--mono);width:40px;flex-shrink:0;">◈ agent</span>
    <input placeholder="step id (e.g. assess)" style="max-width:120px;"/>
    <select>${c._agentOpts || ''}</select>
    <button class="step-remove" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(row);
}

function addWfGate() {
  const c = document.getElementById('wf-steps');
  const row = document.createElement('div');
  row.className = 'step-row';
  row.dataset.kind = 'gate';
  row.innerHTML = `
    <span style="font-size:10px;color:var(--gate);font-family:var(--mono);width:40px;flex-shrink:0;">⬟ gate</span>
    <input placeholder="step id (e.g. review_gate)" style="max-width:130px;" />
    <input placeholder="output field (e.g. decision)" style="max-width:140px;" />
    <input placeholder="options: a,b,c" />
    <button class="step-remove" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(row);
}

async function saveWorkflow() {
  const id      = document.getElementById('wf-id').value.trim();
  const trigger = document.getElementById('wf-trigger').value.trim();
  if (!id) { toast('Workflow ID required', false); return; }

  const rows = document.querySelectorAll('#wf-steps .step-row');
  const steps = [];
  rows.forEach((row, i) => {
    const inputs = row.querySelectorAll('input');
    const selects = row.querySelectorAll('select');
    if (row.dataset.kind === 'agent') {
      const stepId = inputs[0].value.trim() || `step_${i}`;
      const agentId = selects[0]?.value;
      const next = i < rows.length - 1 ? null : undefined;
      steps.push({ id: stepId, agent: agentId });
    } else {
      const stepId    = inputs[0].value.trim() || `gate_${i}`;
      const fieldName = inputs[1].value.trim() || 'decision';
      const options   = (inputs[2].value || 'approved,rejected').split(',').map(s => s.trim());
      steps.push({ id: stepId, gate: { output_field: fieldName, options } });
    }
  });

  // auto-wire linear next edges
  for (let i = 0; i < steps.length - 1; i++) {
    if (!('gate' in steps[i]) && !steps[i].routes) steps[i].next = steps[i+1].id;
  }
  if (steps.length) steps[steps.length-1].next = undefined;
  const lastStep = steps.at(-1);
  const terminal_step = lastStep?.id;

  const wf = {
    id, trigger: { event: trigger }, steps, terminal_step,
  };

  try {
    await api('POST', '/api/workflows', wf);
    await boot();
    S.view = 'workflows'; S.selected = id;
    render(); toast(`Workflow '${id}' saved`);
  } catch(e) { toast(e.message, false); }
}

// ── YAML panel ───────────────────────────────────────────────────────────────
let _yamlState = { editing: false, content: '', path: '', type: '', id: '' };

async function loadYaml(type, id) {
  const endpoint = type === 'workflow' ? `/api/workflows/${id}/yaml` : `/api/agents/${id}/yaml`;
  try {
    const r = await api('GET', endpoint);
    _yamlState = { editing: false, content: r.content, path: r.path, type, id };
    renderYamlPanel();
  } catch(e) { toast(e.message, false); }
}

function renderYamlPanel() {
  const wrap = document.getElementById('yaml-panel-wrap');
  if (!wrap) return;
  const { editing, content, path } = _yamlState;
  wrap.innerHTML = `
    <div class="yaml-toolbar">
      <span class="yaml-path">${path}</span>
      <button class="btn-sm" onclick="copyYaml()" title="Copy">⎘ Copy</button>
      <button class="btn-sm ${editing ? 'active' : ''}" onclick="toggleEdit()">
        ${editing ? '✕ Cancel edit' : '✏ Edit'}
      </button>
      <button class="btn-sm active" onclick="openPrModal()" style="background:var(--accent);color:#fff;border-color:var(--accent);">
        ↗ Propose as PR
      </button>
    </div>
    ${editing
      ? `<textarea class="yaml-textarea" id="yaml-edit" onchange="_yamlState.content=this.value" oninput="_yamlState.content=this.value">${content}</textarea>`
      : `<pre class="yaml-panel">${escHtml(content)}</pre>`
    }`;
}

function toggleEdit() {
  _yamlState.editing = !_yamlState.editing;
  renderYamlPanel();
}

function copyYaml() {
  navigator.clipboard.writeText(_yamlState.content).then(() => toast('Copied'));
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function yamlCard(type, id) {
  return `
    <div class="card" style="margin-top:0">
      <div class="card-header">
        <span class="card-title">⟨/⟩ Config YAML</span>
        <button class="btn-sm" onclick="loadYaml('${type}','${id}')">Load</button>
      </div>
      <div class="card-body">
        <div id="yaml-panel-wrap">
          <div style="font-size:12px;color:var(--text-dim);">
            Click <strong>Load</strong> to view the raw YAML config for this ${type}.
          </div>
        </div>
      </div>
    </div>`;
}

// ── PR modal ──────────────────────────────────────────────────────────────────
function openPrModal() {
  document.getElementById('pr-desc').value = `Update ${_yamlState.type} ${_yamlState.id}`;
  document.getElementById('pr-result').style.display = 'none';
  document.getElementById('pr-submit-btn').style.display = 'inline-flex';
  document.getElementById('pr-modal').classList.add('open');
}

function closePrModal() {
  document.getElementById('pr-modal').classList.remove('open');
}

async function submitPr() {
  const desc = document.getElementById('pr-desc').value.trim();
  const content = document.getElementById('yaml-edit')?.value || _yamlState.content;

  document.getElementById('pr-submit-btn').textContent = 'Creating…';
  document.getElementById('pr-submit-btn').disabled = true;

  try {
    const r = await api('POST', '/api/propose', {
      type:        _yamlState.type,
      id:          _yamlState.id,
      content,
      description: desc,
    });
    const resultEl = document.getElementById('pr-result');
    resultEl.style.display = 'block';
    resultEl.className = 'pr-result';
    resultEl.innerHTML = `✅ PR created — <a href="${r.pr_url}" target="_blank">${r.pr_url}</a><br/>
      <span style="font-size:11px;color:var(--text-dim);">Branch: ${r.branch}</span>`;
    document.getElementById('pr-submit-btn').style.display = 'none';
    toast('PR created');
  } catch(e) {
    const resultEl = document.getElementById('pr-result');
    resultEl.style.display = 'block';
    resultEl.className = 'pr-result';
    resultEl.style.background = '#FEF2F2';
    resultEl.style.borderColor = 'rgba(239,68,68,.3)';
    resultEl.style.color = 'var(--danger)';
    resultEl.textContent = `Error: ${e.message}`;
    document.getElementById('pr-submit-btn').textContent = 'Create PR';
    document.getElementById('pr-submit-btn').disabled = false;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
setView('runs');
boot();
</script>
