id: cve_remediation
trigger:
  source: linear
  event: cve.created

steps:
  - id: gather
    deterministic:
      type: gather_evidence
      output_field: evidence
    next: assess

  - id: assess
    agent:
      type: call_llm
      output_field: assessment
      max_tokens: 512
      prompt: |
        You are a security engineer performing a CVE impact assessment.

        CVE: {advisory_id}
        Summary: {advisory_summary}
        Affected versions: {affected_versions}
        Our locked version: {our_locked_version}

        Return JSON only:
        {
          "affected": true or false,
          "risk_level": "low|medium|high",
          "reasoning": "2-3 sentences",
          "fix_complexity": "simple|moderate|complex",
          "recommended_disposition": "no_fix_needed|fix_authorized|escalate"
        }
    next: security_gate

  - id: security_gate
    gate:
      output_field: disposition
      options: [no_fix_needed, fix_authorized, escalate]
    routes:
      no_fix_needed: record
      escalate:      record
      fix_authorized: scope_gate

  - id: scope_gate
    gate:
      output_field: scope_authorized
      options: [authorized, rejected]
    routes:
      rejected:  record
      authorized: prepare_fix

  - id: prepare_fix
    agent:
      type: call_llm
      output_field: fix
      max_tokens: 512
      prompt: |
        You are preparing a security fix. Write the content only.
        Deterministic code will execute the actual GitHub operations.

        CVE: {advisory_id}
        Package: {affected_package}
        Current version: {our_locked_version}
        Affected versions: {affected_versions}

        Return JSON only:
        {
          "package": "{affected_package}",
          "old_version": "{our_locked_version}",
          "new_version": "<one patch above highest affected>",
          "file_path": "agent/requirements.txt",
          "commit_message": "fix: bump {affected_package} from {our_locked_version} to <new_version> ({advisory_id})",
          "diff_summary": "-{affected_package}=={our_locked_version}\n+{affected_package}==<new_version>",
          "pr_description": "<markdown PR body explaining the CVE and the change>"
        }
    next: run_tests

  - id: run_tests
    deterministic:
      type: run_tests
      output_field: validation
    next: open_pr

  - id: open_pr
    deterministic:
      type: open_pr
      output_field: pr
    next: pr_gate

  - id: pr_gate
    gate:
      output_field: pr_decision
      options: [approved, changes_requested]
    routes:
      changes_requested: record
      approved:          merge

  - id: merge
    deterministic:
      type: merge_pr
      output_field: pr
    next: record

  - id: record
    deterministic:
      type: record_outcome
      output_field: outcome

terminal_step: record
