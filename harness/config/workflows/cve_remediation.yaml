id: cve_remediation
trigger:
  source: linear
  event: issue.label_added
  filter:
    label: kim-test-harness

steps:
  # ── AGENT 1: Research CVE, find patch, prepare all code changes ──────────
  - id: research
    agent:
      uses: research_cve
    next: security_gate

  # ── GATE 1: Security owner reviews the proposed fix ──────────────────────
  - id: security_gate
    gate:
      output_field: disposition
      options: [fix_authorized, mitigation, escalate]
    routes:
      mitigation:     comment_mitigation
      escalate:       record
      fix_authorized: create_branch

  # ── CODE: create branch ───────────────────────────────────────────────────
  - id: create_branch
    deterministic:
      type: github_create_branch
      output_field: branch_result
      base_branch: master
    next: commit_files

  # ── CODE: commit patched files ────────────────────────────────────────────
  - id: commit_files
    deterministic:
      type: github_commit_files
      output_field: commit_result
    next: open_pr

  # ── CODE: open PR + security label + /e2e comment ────────────────────────
  - id: open_pr
    deterministic:
      type: github_open_pr
      output_field: pr
      base_branch: master
    next: validate_pr

  # ── AGENT 2: Wait for CI checks + Prisma scan, classify result ───────────
  - id: validate_pr
    agent:
      uses: pr_validator
    next: route_after_validation

  # ── CODE: route based on pr_validator exit ────────────────────────────────
  # pr_validator sets failure_class — deterministic routing node reads it
  - id: route_after_validation
    gate:
      output_field: validation_routing
      options: [passed, ci_failed, scan_still_vulnerable, infra_flaky, unknown]
    routes:
      passed:               pr_gate
      ci_failed:            research       # code issue → back to agent 1
      scan_still_vulnerable: research      # version not enough → back to agent 1
      infra_flaky:          validate_pr    # wait and retry agent 2
      unknown:              diagnose       # mediator needed

  # ── DIAGNOSE: lightweight mediator for unknown failures ───────────────────
  - id: diagnose
    agent:
      uses: diagnose
    next: route_after_diagnose

  - id: route_after_diagnose
    gate:
      output_field: diagnose_routing
      options: [research, validate_pr, human_gate]
    routes:
      research:     research
      validate_pr:  validate_pr
      human_gate:   pr_gate

  # ── GATE 2: Code owner reviews PR ────────────────────────────────────────
  - id: pr_gate
    gate:
      output_field: pr_decision
      options: [approved, changes_requested]
    routes:
      changes_requested: research
      approved:          merge_pr

  # ── CODE: merge ───────────────────────────────────────────────────────────
  - id: merge_pr
    deterministic:
      type: merge_pr
      output_field: pr
    next: record

  # ── MITIGATION PATH ───────────────────────────────────────────────────────
  - id: comment_mitigation
    deterministic:
      type: comment_on_linear
      output_field: comment_result
    next: mitigation_gate

  - id: mitigation_gate
    gate:
      output_field: mitigation_decision
      options: [done, retry_agent]
    routes:
      done:        record
      retry_agent: research

  # ── TERMINAL ──────────────────────────────────────────────────────────────
  - id: record
    deterministic:
      type: record_outcome
      output_field: outcome

terminal_step: record
