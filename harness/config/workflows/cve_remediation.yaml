id: cve_remediation
trigger:
  source: linear
  event: issue.label_added
  filter:
    label: kim-test-harness

steps:
  # ── AGENT 1: Research CVE locally — zero GitHub writes ───────────────────
  - id: research
    agent:
      uses: research_cve
    next: route_after_research

  # ── Route based on agent 1 exit ──────────────────────────────────────────
  - id: route_after_research
    gate:
      output_field: research_exit
      options: [ready, mitigation, needs_human_guidance, retry_exhausted]
    routes:
      ready:                run_local_checks
      mitigation:           comment_mitigation
      needs_human_guidance: mid_retry_gate
      retry_exhausted:      mark_linear_label

  # ── HUMAN GATE: mid-retry check (fires after N failures) ─────────────────
  - id: mid_retry_gate
    gate:
      output_field: mid_retry_decision
      options: [continue, escalate]
    routes:
      continue:  research
      escalate:  mark_linear_label

  # ── CODE: run checks locally on the patch ────────────────────────────────
  - id: run_local_checks
    deterministic:
      type: run_local_checks
      output_field: local_checks
      base_branch: master
    next: route_after_checks

  - id: route_after_checks
    gate:
      output_field: local_checks_routing
      options: [passed, failed]
    routes:
      failed: research
      passed: open_prs

  # ── CODE: open real PRs (1+ per affected repo) ───────────────────────────
  - id: open_prs
    deterministic:
      type: github_open_pr
      output_field: pr
      base_branch: master
    next: wait_for_checks

  # ── CODE: wait for CI checks + Prisma scan ───────────────────────────────
  - id: wait_for_checks
    deterministic:
      type: poll_pr_checks
      output_field: pr_checks
      max_wait_seconds: 600
    next: route_after_pr_checks

  - id: route_after_pr_checks
    gate:
      output_field: pr_checks_routing
      options: [passed, failed]
    routes:
      failed: research
      passed: trigger_e2e

  # ── CODE: trigger e2e suite ───────────────────────────────────────────────
  - id: trigger_e2e
    deterministic:
      type: trigger_e2e
      output_field: e2e_result
    next: route_after_e2e

  - id: route_after_e2e
    gate:
      output_field: e2e_routing
      options: [passed, failed]
    routes:
      failed: research
      passed: assess_risk

  # ── AGENT 2: Independent risk assessment ─────────────────────────────────
  - id: assess_risk
    agent:
      uses: risk_assessor
    next: pr_gate

  # ── HUMAN GATE: review PR + risk assessment ───────────────────────────────
  - id: pr_gate
    gate:
      output_field: pr_decision
      options: [approved, changes_requested]
    routes:
      changes_requested: research
      approved:          merge_prs

  # ── CODE: merge all PRs ───────────────────────────────────────────────────
  - id: merge_prs
    deterministic:
      type: merge_pr
      output_field: pr
    next: record

  # ── MITIGATION PATH ───────────────────────────────────────────────────────
  - id: comment_mitigation
    deterministic:
      type: comment_on_linear
      output_field: comment_result
    next: mitigation_gate

  - id: mitigation_gate
    gate:
      output_field: mitigation_decision
      options: [done, retry_agent]
    routes:
      done:        record
      retry_agent: research

  # ── RETRY EXHAUSTED PATH ──────────────────────────────────────────────────
  - id: mark_linear_label
    deterministic:
      type: comment_on_linear
      output_field: label_result
    next: escalation_gate

  - id: escalation_gate
    gate:
      output_field: escalation_decision
      options: [close, retry_agent]
    routes:
      close:       record
      retry_agent: research

  # ── TERMINAL ──────────────────────────────────────────────────────────────
  - id: record
    deterministic:
      type: record_outcome
      output_field: outcome

terminal_step: record
