id: cve_remediation
trigger:
  source: linear
  event: issue.label_added
  filter:
    label: kim-test-harness

steps:
  # ── STEP 1: Agent investigates, finds and prepares the patch ─────────────
  - id: research
    agent:
      uses: research_cve
    next: security_gate

  # ── GATE 1: Security owner reviews the proposed fix ──────────────────────
  - id: security_gate
    gate:
      output_field: disposition
      options: [fix_authorized, mitigation, escalate]
    routes:
      mitigation:     comment_mitigation
      escalate:       record
      fix_authorized: create_branch

  # ── STEP 2: CODE — create branch in target repo ──────────────────────────
  - id: create_branch
    deterministic:
      type: github_create_branch
      output_field: branch_result
      base_branch: master
    next: commit_files

  # ── STEP 3: CODE — commit patched files ──────────────────────────────────
  - id: commit_files
    deterministic:
      type: github_commit_files
      output_field: commit_result
    next: open_pr

  # ── STEP 4: CODE — open PR + add label + comment /e2e ────────────────────
  - id: open_pr
    deterministic:
      type: github_open_pr
      output_field: pr
      base_branch: master
    next: validate_pr

  # ── STEP 5: pr_validator agent — wait for checks + security scan ─────────
  - id: validate_pr
    agent:
      uses: pr_validator
    next: pr_gate

  # ── GATE 2: Code owner reviews the PR ────────────────────────────────────
  - id: pr_gate
    gate:
      output_field: pr_decision
      options: [approved, changes_requested]
    routes:
      changes_requested: record
      approved:          merge_pr

  # ── STEP 6: CODE — merge ─────────────────────────────────────────────────
  - id: merge_pr
    deterministic:
      type: merge_pr
      output_field: pr
    next: record

  # ── MITIGATION PATH ───────────────────────────────────────────────────────
  - id: comment_mitigation
    deterministic:
      type: comment_on_linear
      output_field: comment_result
    next: mitigation_gate

  - id: mitigation_gate
    gate:
      output_field: mitigation_decision
      options: [done, retry_agent]
    routes:
      done:        record
      retry_agent: research

  # ── TERMINAL ──────────────────────────────────────────────────────────────
  - id: record
    deterministic:
      type: record_outcome
      output_field: outcome

terminal_step: record
