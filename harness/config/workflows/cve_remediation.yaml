id: cve_remediation
trigger:
  source: linear
  event: issue.label_added
  filter:
    label: kim-test-harness

steps:
  # ── AGENT 1: Research CVE locally ────────────────────────────────────────
  - id: research
    agent:
      uses: research_cve
    next: route_research

  # ── AUTO-ROUTE: maps agent output → research_exit ─────────────────────────
  - id: route_research
    deterministic:
      type: auto_route
      output_field: research_exit
      route_type: research
    routes:
      ready:                run_local_checks
      mitigation:           comment_mitigation
      needs_human_guidance: mid_retry_gate
      retry_exhausted:      mark_linear_label

  # ── HUMAN GATE: mid-retry check (fires after N agent failures) ────────────
  - id: mid_retry_gate
    gate:
      output_field: mid_retry_decision
      options: [continue, escalate]
    routes:
      continue:  research
      escalate:  mark_linear_label

  # ── CODE: run checks locally on the patch ────────────────────────────────
  - id: run_local_checks
    deterministic:
      type: run_local_checks
      output_field: local_checks
      base_branch: master
    next: route_checks

  # ── AUTO-ROUTE: maps check result → routing ───────────────────────────────
  - id: route_checks
    deterministic:
      type: auto_route
      output_field: local_checks_routing
      route_type: checks
    routes:
      passed: create_branch
      failed: research

  # ── CODE: create branch in GitHub ─────────────────────────────────────────
  - id: create_branch
    deterministic:
      type: github_create_branch
      output_field: branch_result
      base_branch: master
    next: commit_files

  # ── CODE: commit patched files ────────────────────────────────────────────
  - id: commit_files
    deterministic:
      type: github_commit_files
      output_field: commit_result
    next: open_prs

  # ── CODE: open draft PRs ──────────────────────────────────────────────────
  - id: open_prs
    deterministic:
      type: github_open_pr
      output_field: pr
      base_branch: master
    next: wait_for_checks

  # ── CODE: wait for CI + Prisma scan ──────────────────────────────────────
  - id: wait_for_checks
    deterministic:
      type: poll_pr_checks
      output_field: pr_checks
      max_wait_seconds: 600
    next: route_pr_checks

  # ── AUTO-ROUTE: maps CI result → routing ─────────────────────────────────
  - id: route_pr_checks
    deterministic:
      type: auto_route
      output_field: pr_checks_routing
      route_type: pr_checks
    routes:
      passed: trigger_e2e
      failed: research

  # ── CODE: trigger e2e ─────────────────────────────────────────────────────
  - id: trigger_e2e
    deterministic:
      type: trigger_e2e
      output_field: e2e_result
    next: route_e2e

  # ── AUTO-ROUTE: maps e2e result → routing ────────────────────────────────
  - id: route_e2e
    deterministic:
      type: auto_route
      output_field: e2e_routing
      route_type: e2e
    routes:
      passed: assess_risk
      failed: research

  # ── AGENT 2: Independent risk assessment ─────────────────────────────────
  - id: assess_risk
    agent:
      uses: risk_assessor
    next: pr_gate

  # ── HUMAN GATE: review PR + risk assessment ───────────────────────────────
  - id: pr_gate
    gate:
      output_field: pr_decision
      options: [approved, changes_requested]
    routes:
      changes_requested: research
      approved:          merge_prs

  # ── CODE: merge all PRs ───────────────────────────────────────────────────
  - id: merge_prs
    deterministic:
      type: merge_pr
      output_field: pr
    next: record

  # ── MITIGATION PATH ───────────────────────────────────────────────────────
  - id: comment_mitigation
    deterministic:
      type: comment_on_linear
      output_field: comment_result
    next: mitigation_gate

  - id: mitigation_gate
    gate:
      output_field: mitigation_decision
      options: [done, retry_agent]
    routes:
      done:        record
      retry_agent: research

  # ── RETRY EXHAUSTED PATH ──────────────────────────────────────────────────
  - id: mark_linear_label
    deterministic:
      type: comment_on_linear
      output_field: label_result
    next: escalation_gate

  - id: escalation_gate
    gate:
      output_field: escalation_decision
      options: [close, retry_agent]
    routes:
      close:       record
      retry_agent: research

  # ── TERMINAL ──────────────────────────────────────────────────────────────
  - id: record
    deterministic:
      type: record_outcome
      output_field: outcome

terminal_step: record
