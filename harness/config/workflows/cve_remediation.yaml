id: cve_remediation
trigger:
  source: linear
  event: cve.created

steps:
  # ── Deterministic: read advisory + deps ──────────────────────────────────
  - id: gather
    type: gather_evidence
    output_field: evidence
    next: assess

  # ── LLM: reason about impact and risk ───────────────────────────────────
  - id: assess
    type: call_llm
    output_field: assessment
    max_tokens: 512
    prompt: |
      You are a security engineer performing a CVE impact assessment.

      CVE: {advisory_id}
      Summary: {advisory_summary}
      Affected versions: {affected_versions}
      Our locked version: {our_locked_version}

      Return JSON only:
      {
        "affected": true or false,
        "risk_level": "low|medium|high",
        "reasoning": "2-3 sentences",
        "fix_complexity": "simple|moderate|complex",
        "recommended_disposition": "no_fix_needed|fix_authorized|escalate"
      }
    next: security_gate

  # ── Human gate: security owner decides ──────────────────────────────────
  - id: security_gate
    gate:
      output_field: disposition
      options: [no_fix_needed, fix_authorized, escalate]
    routes:
      no_fix_needed: record
      escalate:      record
      fix_authorized: scope_gate

  # ── Human gate: repo owner authorizes scope ──────────────────────────────
  - id: scope_gate
    gate:
      output_field: scope_authorized
      options: [authorized, rejected]
    routes:
      rejected:  record
      authorized: prepare_fix

  # ── LLM: write the fix content and PR description ────────────────────────
  - id: prepare_fix
    type: call_llm
    output_field: fix
    max_tokens: 512
    prompt: |
      You are preparing a security fix. Write the content — code executes the actions.

      CVE: {advisory_id}
      Package: {affected_package}
      Current version: {our_locked_version}
      Affected versions: {affected_versions}

      Safe version = one patch above the highest affected version.

      Return JSON only:
      {
        "package": "{affected_package}",
        "old_version": "{our_locked_version}",
        "new_version": "<safe version>",
        "file_path": "agent/requirements.txt",
        "commit_message": "fix: bump {affected_package} from {our_locked_version} to <new_version> ({advisory_id})",
        "diff_summary": "-{affected_package}=={our_locked_version}\n+{affected_package}==<new_version>",
        "pr_description": "<markdown PR body explaining the CVE and the change>"
      }
    next: run_tests

  # ── Deterministic: run test suite + rescan ───────────────────────────────
  - id: run_tests
    type: run_tests
    output_field: validation
    next: open_pr

  # ── Deterministic: create branch, commit, open draft PR ──────────────────
  - id: open_pr
    type: open_pr
    output_field: pr
    next: pr_gate

  # ── Human gate: code owner reviews and approves ──────────────────────────
  - id: pr_gate
    gate:
      output_field: pr_decision
      options: [approved, changes_requested]
    routes:
      changes_requested: record
      approved:          merge

  # ── Deterministic: squash merge via GitHub API ───────────────────────────
  - id: merge
    type: merge_pr
    output_field: pr
    next: record

  # ── Deterministic: record final outcome ──────────────────────────────────
  - id: record
    type: record_outcome
    output_field: outcome

terminal_step: record
